<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GatoBom - perfil de mascota</title>
    <link rel="stylesheet" href="diseño.css" id="estiloTema" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="tarjeta" id="tarjetaMascota">
        <div class="handle-arrastre-tarjeta" title="Arrastrar tarjeta">
            <i class="fas fa-grip-lines"></i>
        </div>

        <div class="seccionEncabezado">
            <label for="fotoGato" class="cajaFoto" id="vistaPreviaFoto">
                <i class="fas fa-camera" id="iconoCamara"></i>
            </label>
            <input type="file" id="fotoGato" accept="image/*" style="display: none;" />
            <div class="cajaNombre">
                <span data-traduccion="etiquetaNombre">Nombre</span>
                <input type="text" id="entradaNombreMascota" value="TOM" placeholder="Nombre" />
            </div>
        </div>

        <h2 data-traduccion="tituloDatosGato">Datos del Gato:</h2>

        <div class="filaFormulario">
            <label><i class="fas fa-venus-mars"></i> <span data-traduccion="etiquetaGenero">Género</span></label>
            <div class="grupoOpciones">
                <label><input type="radio" name="genero" value="M" checked /> <span data-traduccion="opcionMacho">Macho</span></label>
                <label><input type="radio" name="genero" value="F" /> <span data-traduccion="opcionHembra">Hembra</span></label>
            </div>
        </div>

        <div class="filaFormulario">
            <label><i class="fas fa-notes-medical"></i> <span data-traduccion="etiquetaEsterilizado">Esterilizado</span></label>
            <div class="grupoOpciones">
                <label><input type="radio" name="esterilizado" value="si" checked /> <span data-traduccion="opcionSi">Sí</span></label>
                <label><input type="radio" name="esterilizado" value="no" /> <span data-traduccion="opcionNo">No</span></label>
            </div>
        </div>

        <div class="filaFormulario">
            <label><i class="fas fa-hourglass-half"></i> <span data-traduccion="etiquetaTiempoVida">Tiempo de vida</span></label>
            <input type="text" value="5" placeholder="Años/Meses" />
        </div>

        <div class="filaFormulario">
            <label><i class="fas fa-calendar-check"></i> <span data-traduccion="etiquetaFechaAdopcion">Fecha de adopción</span></label>
            <input type="date" value="2021-05-26" />
        </div>

        <div class="filaFormulario entradasEnLinea">
            <div class="grupoEntrada">
                <label><i class="fas fa-weight"></i> <span data-traduccion="etiquetaPeso">Peso:</span></label>
                <input type="text" placeholder="Ej. 4 kg" />
            </div>
            <div class="grupoEntrada">
                <label><i class="fas fa-ruler-vertical"></i> <span data-traduccion="etiquetaAltura">Altura:</span></label>
                <input type="number" placeholder="Ej. 25 cm" />
            </div>
        </div>

        <div class="filaFormulario" style="margin-top: 25px; flex-wrap: nowrap; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <label style="min-width: auto;"><i class="fas fa-bug-slash"></i> <span data-traduccion="etiquetaDesparasitado">Desparasitado</span></label>
                <div class="grupoOpciones" style="gap: 10px;">
                    <label><input type="radio" name="desparasitado" value="si" checked /> <span data-traduccion="opcionSi">Sí</span></label>
                    <label><input type="radio" name="desparasitado" value="no" /> <span data-traduccion="opcionNo">No</span></label>
                </div>
            </div>
            <div class="envolturaFecha" id="fechaDesparasitado">
                <span data-traduccion="etiquetaFecha">Fecha:</span>
                <input type="date" style="max-width: 130px;" />
            </div>
        </div>

        <h3 class="tituloSeccion"><i class="fas fa-syringe"></i> <span data-traduccion="tituloVacunas">Vacunas del Gato</span></h3>
        <div id="contenedorVacunas">
            <div class="filaVacuna">
                <label><input type="checkbox" /> <span data-traduccion="vacunaTriple">Triple Felina</span></label>
                <div class="envolturaFecha">
                    <span data-traduccion="etiquetaFecha">Fecha:</span>
                    <input type="date" />
                </div>
                <button type="button" class="botonEliminarVacuna" title="Eliminar vacuna">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
            <div class="filaVacuna">
                <label><input type="checkbox" /> <span data-traduccion="vacunaRabica">Rábica</span></label>
                <div class="envolturaFecha">
                    <span data-traduccion="etiquetaFecha">Fecha:</span>
                    <input type="date" />
                </div>
                <button type="button" class="botonEliminarVacuna" title="Eliminar vacuna">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
            <div class="filaVacuna">
                <label><input type="checkbox" /> <span data-traduccion="vacunaLeucemia">Leucemia Felina</span></label>
                <div class="envolturaFecha">
                    <span data-traduccion="etiquetaFecha">Fecha:</span>
                    <input type="date" />
                </div>
                <button type="button" class="botonEliminarVacuna" title="Eliminar vacuna">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>
        <button class="botonAgregarVacuna" id="agregarVacuna">
            <i class="fas fa-plus"></i> <span data-traduccion="botonAgregarVacuna">Agregar Vacuna</span>
        </button>

        <h3 class="tituloSeccion"><i class="fas fa-sticky-note"></i> <span data-traduccion="tituloNotas">Notas</span></h3>
        <div class="filaFormulario">
            <textarea id="notaMascota" class="area-notas" rows="4" placeholder="Escribe aquí cualquier observación adicional..."></textarea>
        </div>

        <button class="botonAccion" id="botonDescarga">
            <i class="fas fa-file-pdf"></i> <span data-traduccion="botonDescargar">Descargar PDF</span>
        </button>
    </div>

    <!-- Footer compactado y con ID para la imagen del autor -->
    <footer class="footer-personalizacion">
        <div class="panel-colores" id="panelColores">
            <button id="alternarTema" class="botonLimpiar">
                <i class="fas fa-moon"></i> Modo Oscuro
            </button>
            
            <label>
                <i class="fas fa-globe"></i>
                <select id="selectorIdioma" class="botonLimpiar" style="cursor: pointer; border: none; background: transparent; font-family: inherit; font-size: inherit; color: inherit; outline: none;">
                    <option value="es" selected>Español</option>
                    <option value="en">English</option>
                    <option value="pt">Português neutro</option>
                    <option value="fr">frances neutro</option>
                    <option value="it">Italiano neutro</option>
                    <option value="gsw">Aleman</option>
                    <option value="cs">checo</option>
                    <option value="et">Estonio</option>
                    <option value="eo">Esperanto</option>
                </select>
            </label>

            <label><input type="color" id="colorAcento" value="#00d2ff" /> Color Acento</label>
            <label><input type="color" id="colorFondo" value="#0a0a0a" /> Fondo Principal</label>
            <label><input type="color" id="colorTarjeta" value="#1e1e1e" /> Fondo Tarjeta</label>
            <label>
                <i class="fas fa-image"></i>
                <input type="file" id="fondoImagen" accept="image/*" style="display: none;" />
                Fondo
            </label>
            <button id="limpiarFondo" class="botonLimpiar"><i class="fas fa-times"></i> Limpiar</button>

            <div class="seccion-autor">
                <a href="https://github.com/thegabrielplusx/" target="_blank" style="display: inline-block;">
                    <img id="imagenAutor" src="autor.webp" alt="GitHub thegabrielplusx" style="width: 35px; height: 35px; border-radius: 50%; background-color: white; padding: 2px; transition: transform 0.3s ease, box-shadow 0.3s ease;" onmouseover="this.style.transform='scale(1.1)'; this.style.boxShadow='0 0 15px rgba(var(--colorAcentoRgb), 0.6)';" onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='none';" />
                </a>
 <a href="https://github.com/ZITZ-bit" target="_blank" style="display: inline-block;">
                    <img id="imagenAutor" src="coloborador.png" alt="GitHub thegabrielplusx" style="width: 35px; height: 35px; border-radius: 50%; background-color: white; padding: 2px; transition: transform 0.3s ease, box-shadow 0.3s ease;" onmouseover="this.style.transform='scale(1.1)'; this.style.boxShadow='0 0 15px rgba(var(--colorAcentoRgb), 0.6)';" onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='none';" />
                </a>

            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
